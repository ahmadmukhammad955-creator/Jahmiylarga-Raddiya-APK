
name: Build Ahmad Kitob APK (No Audio)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Unpack Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Ahmad_Kitob_No_Audio_Android_Project_READY_TO_BUILD.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            exit 1
          fi
          mkdir -p android_project
          unzip -q "$ZIP_FILE" -d android_project
          test -f android_project/settings.gradle
          test -f android_project/app/build.gradle

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android_project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ahmad-Kitob-No-Audio-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
